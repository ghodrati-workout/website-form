<style>
  body { font-family: sans-serif; max-width: 400px; margin: 40px auto; }
  input, textarea, select { display: block; width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
  button { padding: 8px 16px; cursor: pointer; }
</style>

<form id="myForm">
  <input name="firstName" placeholder="First Name" required />
  <input name="lastName" placeholder="Last Name" required />

  <select name="gender" required>
    <option value="" selected disabled>Select gender</option>
    <option value="female">Female</option>
    <option value="male">Male</option>
  </select>

  <input name="age" type="number" min="0" max="120" placeholder="Age" />
  <input name="email" type="email" placeholder="Email" required />

  <select name="country">
    <option value="" selected>Choose country (optional)</option>
    <option value="US">United States</option>
    <option value="CA">Canada</option>
    <option value="UK">United Kingdom</option>
  </select>

  <textarea name="message" placeholder="Message"></textarea>

  <button type="submit">Send</button>
</form>

<script>
  document.getElementById('myForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const data = Object.fromEntries(new FormData(e.target));
    console.log("Sending:", data);

    const res = await fetch('https://backend-worker.alireza-zsn.workers.dev/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });

    if (res.ok) alert('Sent!');
    else alert('Something went wrong.');
  });
</script>
