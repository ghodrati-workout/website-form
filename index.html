<style>
  body { font-family: sans-serif; max-width: 400px; margin: 40px auto; }
  input, textarea, select { display: block; width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
  button { padding: 8px 16px; cursor: pointer; }
</style>

<form id="myForm">
  <input name="firstName" placeholder="نام" required />
  <input name="lastName" placeholder="نام خانوادگی" required />

  <select name="gender" required>
    <option value="" selected disabled>جنسیت</option>
    <option value="female">زن</option>
    <option value="male">مرد</option>
  </select>

  <input name="age" type="number" min="0" max="120" placeholder="سن" />
  <input name="email" type="email" placeholder="ایمیل" required />

  <select name="country">
    <option value="" selected>شهر خود را انتخاب کنبد (انتخابی)</option>
    <option value="US">مشهد</option>
    <option value="CA">شیراز</option>
    <option value="UK">تهران</option>
  </select>

  <textarea name="message" placeholder="توضیحات"></textarea>

  <button type="submit">Send</button>
</form>

<script>
  document.getElementById('myForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const data = Object.fromEntries(new FormData(e.target));
    console.log("Sending:", data);

    const res = await fetch('https://backend-worker.alireza-zsn.workers.dev/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });

    if (res.ok) alert('Sent!');
    else alert('Something went wrong.');
  });
</script>
